


[package]
name = "yunsport-assistant"
version = "0.1.0"
edition = "2021"
default-run = "yunsport-assistant"

[lib]
name = "yunsport"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yunsport-assistant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
sm2 = { version = "0.14", features = ["pke", "der", "getrandom", "alloc", "arithmetic"] }
sm4 = { version = "0.6" }
cipher = "0.5"
generic-array = "0.14"
rand_core = "0.10"
geographiclib-rs = "0.2"
rand = { version = "0.9", features = ["os_rng", "std", "std_rng", "thread_rng"] }
md5 = "0.7"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
webbrowser = "1"
